name = "ITreeMasterMind"
version = "0.1.0"
defaultTargets = ["itreemastermind"]
testDriver = "Proofs"   # `lake test` = check all proofs

[[lean_exe]]
name = "itreemastermind"
root = "Main"

[[lean_lib]]
name = "Practice"
globs = ["Practice.+"]

[[lean_lib]]
name = "Mastermind"
globs = ["Mastermind.+"]

[[lean_lib]]
name = "Proofs"
globs = ["Proofs.+"]
